short_bio: >-
  <p>
    I am Zibo Wang, a mechanical engineering undergraduate at Shanghai Jiao Tong University, where I began my studies in 2024. My interests include robotics, computer vision, and multimodal learning. I have a strong passion for technology and innovation, and I am always eager to learn and explore new ideas.
  </p>
  <p>
    At RHOS, my research under the supervision of Professors Yong-Lu Li and Cewu Lu has focused on how robots adapt to new tools.
  </p>
  <p>
    I am a research intern at ACE Robotics, where I focus on egocentric data and simulation infrastructure.
  </p>
  <p>
    I also work as a research intern in Prof. Bo Zhao's MINT-lab at Shanghai Jiao Tong University.
  </p>

