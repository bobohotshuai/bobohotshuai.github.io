{% assign publications = include.publications %}
<div class="my-3 p-0 bg-white shadow-sm rounded-xl">
    <h2 class="h6 border-bottom border-gray p-3 mb-0">
        <a class="text-body" href="{{ '/publications/' | relative_url }}">{{ include.title | default: 'Publications' }}</a>
    </h2>
    {% for item in publications limit:include.limit %}
        {% include widgets/publication_item.html item=item hide_bottom_border=forloop.last %}
    {% endfor %}
</div>
